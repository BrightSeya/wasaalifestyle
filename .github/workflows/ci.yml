name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sanity:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block env files, private log and large files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env file is committed"; exit 1
          fi
          if git ls-files | grep -q 'PROJECT_LOG.md'; then
            echo "::error::PROJECT_LOG.md must stay local"; exit 1
          fi
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +50M)
          if [ -n "$big" ]; then
            echo "::error::Files over 50MB: $big"; exit 1
          fi

  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
