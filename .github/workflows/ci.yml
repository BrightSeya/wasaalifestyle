name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sanity:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block env files, private log and large files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env file is committed"; exit 1
          fi
          if git ls-files | grep -q 'PROJECT_LOG.md'; then
            echo "::error::PROJECT_LOG.md must stay local"; exit 1
          fi
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +50M)
          if [ -n "$big" ]; then
            echo "::error::Files over 50MB: $big"; exit 1
          fi
