name: Bug
description: Something is not working as expected
title: "fix: "
labels: ["type:bug"]
assignees: ["BrightSeya"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
